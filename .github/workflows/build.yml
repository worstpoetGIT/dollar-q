name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app and sync it into the Android project
        run: |
          npx vite build
          npx cap sync android
      - name: Build the APK (unsigned; it is signed on the maintainer's own machine)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/DollarQ-unsigned.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: DollarQ-apk
          path: out/DollarQ-unsigned.apk
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and sync it into the iOS project
        run: |
          npx vite build
          npx cap sync ios
      - name: Build the unsigned .ipa
        run: ./build-ios.sh
      - name: Print the end of the build log on failure
        if: failure()
        run: tail -80 build-log.txt || true
      - name: Collect the IPA
        run: mkdir out && cp DollarQ-unsigned.ipa out/DollarQ-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DollarQ-ipa
          path: out/DollarQ-unsigned.ipa
          retention-days: 14
