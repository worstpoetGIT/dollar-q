name: Build apps

# main gets built after every merge. a tag like v0.3.1 builds the same way and then opens a DRAFT release with the
# unsigned files. publishing it stays a manual step, because the Android signing key never leaves the maintainer's machine.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: The tag must match the version in the app
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

  android:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app and sync it into the Android project
        run: |
          npx vite build
          npx cap sync android
      - name: Build the APK (unsigned; it is signed on the maintainer's own machine)
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/DollarQ-unsigned.apk
          ls -la out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DollarQ-apk
          path: out/DollarQ-unsigned.apk
          retention-days: 14

  ios:
    needs: test
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and sync it into the iOS project
        run: |
          npx vite build
          npx cap sync ios
      - name: Build the unsigned .ipa
        run: ./build-ios.sh
      - name: Print the end of the build log on failure
        if: failure()
        run: tail -80 build-log.txt || true
      - name: Collect the IPA
        run: mkdir out && cp DollarQ-unsigned.ipa out/DollarQ-unsigned.ipa
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: DollarQ-ipa
          path: out/DollarQ-unsigned.ipa
          retention-days: 14

  # only for a tag: gather both files into a draft release. nothing is public until the maintainer signs the APK and presses publish.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: out
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -la out
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes out/*
