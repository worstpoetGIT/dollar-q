name: Build apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build the web app and sync it into the Android project
        run: |
          npx vite build
          npx cap sync android
      - name: Restore the signing key (only when the secret exists)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/dollarq-release.p12"
            echo "DQ_KEYSTORE=$RUNNER_TEMP/dollarq-release.p12" >> "$GITHUB_ENV"
          fi
      - name: Build the APK
        env:
          DQ_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect the APK
        run: |
          mkdir out
          cp android/app/build/outputs/apk/release/*.apk out/DollarQ.apk
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: DollarQ-apk
          path: out/DollarQ.apk
          retention-days: 14

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the web app and sync it into the iOS project
        run: |
          npx vite build
          npx cap sync ios
      - name: Build the unsigned .ipa
        run: ./build-ios.sh
      - name: Print the end of the build log on failure
        if: failure()
        run: tail -80 build-log.txt || true
      - name: Collect the IPA
        run: mkdir out && cp DollarQ-unsigned.ipa out/DollarQ-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: DollarQ-ipa
          path: out/DollarQ-unsigned.ipa
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-files
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist-files
          gh release create "$GITHUB_REF_NAME" dist-files/DollarQ.apk dist-files/DollarQ-unsigned.ipa \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Android: install DollarQ.apk directly. iPhone: sign DollarQ-unsigned.ipa with a sideloading tool such as iLoader. See the README."
